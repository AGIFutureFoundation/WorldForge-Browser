name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: site manifest, links and secrets
        run: node tools/check_site.mjs
