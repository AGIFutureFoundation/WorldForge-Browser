name: fly-deploy
# Deploys the WorldForge API (cloud/fly-api) to Fly.io.
# REQUIRED SECRET: repo Settings -> Secrets and variables -> Actions ->
#   FLY_API_TOKEN = a Fly.io deploy token (flyctl tokens deploy -a worldforge-api).
# Without the secret this workflow skips with a clear message instead of failing the build.
on:
  push:
    branches: [main]
    paths: ['cloud/fly-api/**', 'fly.toml', 'cloud/datasets-api/src/routes/marketplace-v2.ts']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check token
        id: token
        run: |
          if [ -z "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "FLY_API_TOKEN secret is not set -- skipping deploy."
            echo "add=repo Settings -> Secrets and variables -> Actions -> FLY_API_TOKEN"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.token.outputs.skip != 'true'
      - name: Deploy
        if: steps.token.outputs.skip != 'true'
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
