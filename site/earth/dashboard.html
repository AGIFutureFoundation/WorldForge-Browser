<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorldForge Command Center</title><style>:root{--bg:#0a0f14;--surface:#111827;--primary:#34d399;--text:#e2e8f0;--text-muted:#64748b;--border:rgba(255,255,255,.08);--blue:#60a5fa;--purple:#a78bfa}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}a{color:var(--primary);text-decoration:none}.header{background:linear-gradient(135deg,var(--bg),#111827);padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}.header h1{font-size:1.3rem}.header h1 span{color:var(--primary)}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--border)}.stat{text-align:center;padding:8px;background:#1e293b;border-radius:6px;bo<!doctype html><html lang="en"><he .v{font-size:1.4rem;font-weight:700;color:var(--primary)}.stat .l{font-size:.6rem;color:var(--text-muted);text-transform:uppercase;margin-top:2px}.layout{display:grid;grid-template-columns:200px 1fr;min-height:calc(100vh - 160px)}.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:12px;overflow-y:auto}.sidebar h3{font-size:.65rem;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px}.fi{display:flex;align-items:center;gap:5px;padding:4px 6px;border-radius:4px;cursor:pointer;font-size:.8rem;margin-bottom:2px}.fi:hover{background:rgba(52,211,153,.1)}.fi.active{background:rgba(52,211,153,.15);color:var(--primary)}.fi .c{margin-left:auto;background:#1e293b;padding:1px 6px;border-radius:6px;font-size:.6rem;color:var(--text-muted)}.search{position:relative;margin-bottom:12px}.search input{width:100%;padding:8px 10px 8px 28px;background:#1e293b;border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.8rem;outline:none}.search input:focus{border-color:var(--primary)}.search .ic{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--text-muted)}.main{padding:16px 24px;overflow-y:auto}.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.mh h2{font-size:1rem}.mh .r{font-size:.75rem;color:var(--text-muted)}.wg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.wc{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;transition:all .2s}.wc:hover{border-color:rgba(52,211,153,.3);transform:translateY(-1px)}.wc h3{font-size:.9rem;margin-bottom:6px}.wc h3 a{color:var(--text)}.wc h3 a:hover{color:var(--primary)}.wc .loc{font-size:.7rem;color:var(--text-muted);margin-bottom:8px}.wc .meta{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:10px}.wc .mi{background:#1e293b;padding:5px 7px;border-radius:4px;font-size:.65rem}.wc .mi .lb{color:var(--text-muted)}.wc .mi .vl{color:var(--text);font-weight:500}.wc .tags{display:flex;flex-wrap:wrap;gap:4px}.wc .tag{font-size:.6rem;padding:1px 5px;border-radius:3px;background:rgba(255,255,255,.04);color:var(--text-muted)}.wc .tag.rb{background:rgba(96,165,250,.15);color:var(--blue)}.wc .tag.tr{background:rgba(167,139,250,.15);color:var(--purple)}.wc .acts{display:flex;gap:5px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}.wc .ab{flex:1;padding:5px;text-align:center;border-radius:4px;background:#1e293b;color:var(--text-muted);font-size:.7rem;cursor:pointer}.wc .ab:hover{background:rgba(52,211,153,.15);color:var(--primary)}.footer{text-align:center;padding:12px;color:var(--text-muted);font-size:.65rem;border-top:1px solid var(--border);margin-top:16px}.btn{padding:6px 12px;border-radius:4px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:.75rem;cursor:pointer}.btn:hover{background:rgba(52,211,153,.1)}.btn.pr{background:var(--primary);color:var(--bg);border-color:var(--primary);font-weight:600}</style></head><body><div class="header"><h1>WorldForge <span>Command Center</span></h1><div><button class="btn pr" onclick="window.location.href=\"https://datasets-api.worldforge.dev/v1/catalog\"">View Datasets</button></div></div><div class="stats"><div class="stat"><div class="v" id="total-worlds">0</div><div class="l">Worlds</div></div><div class="stat"><div class="v bl" id="total-industries">0</div><div class="l">Industries</div></div><div class="stat"><div class="v pu" id="total-cities">0</div><div class="l">Cities</div></div><div class="stat"><div class="v am" id="total-robots">0</div><div class="l">Robot Types</div></div></div><div class="layout"><div class="sidebar"><div class="search"><span class="ic">&#9906;</span><input type="text" id="search" placeholder="Search worlds..."></div><div class="fg"><h3>Regions</h3><div id="region-filters"></div></div><div class="fg"><h3>Industries</h3><div id="industry-filters"></div></div></div><div class="main"><div class="mh"><h2>All Worlds</h2><span class="r" id="results">0 worlds</span></div><div class="wg" id="worlds-grid"></div></div></div><div class="footer">Agents operate; people govern. &copy; 2026 WorldForge</div><script>let worlds=[],regions={},industries={},selectedRegion="all",selectedIndustry="all",searchTerm="";function loadWorlds(){fetch("worlds.json").then(r=>r.json()).then(data=>{if(Array.isArray(data)){worlds=data;data.forEach(w=>{let city=w.p?w.p.split(",").pop().trim():"Unknown";let region=w.p?w.p.split(",")[0].trim():"Unknown";let industry=w.i||"general";regions[region]=(regions[region]||0)+1;industries[industry]=(industries[industry]||0)+1})}else{Object.entries(data).forEach(([k,w])=>{w.slug=k;worlds.push(w);let city=w.p?w.p.split(",").pop().trim():"Unknown";let region=w.p?w.p.split(",")[0].trim():"Unknown";let industry=w.i||"general";regions[region]=(regions[region]||0)+1;industries[industry]=(industries[industry]||0)+1})}updateStats();renderFilters();renderWorlds()}).catch(e=>{console.error("Error loading worlds:",e);document.getElementById("worlds-grid").innerHTML="<div class=\"empty\"><h3>Could not load worlds</h3><p>Check that worlds.json is accessible</p></div>"})}function updateStats(){document.getElementById("total-worlds").textContent=worlds.length;document.getElementById("total-industries").textContent=Object.keys(industries).length;document.getElementById("total-cities").textContent=Object.keys(regions).length;let robots=new Set();worlds.forEach(w=>(w.rf||[]).forEach(r=>robots.add(r)));document.getElementById("total-robots").textContent=robots.size}function renderFilters(){let rf=document.getElementById("region-filters");rf.innerHTML=`<div class="fi ${selectedRegion==="all"?"active":""}" onclick="filterRegion('all')">All<span class="c">${worlds.length}</span></div>`;Object.entries(regions).sort((a,b)=>b[1]-a[1]).forEach(([r,c])=>{rf.innerHTML+=`<div class="fi ${selectedRegion===r?"active":""}" onclick="filterRegion('${r}')">${r}<span class="c">${c}</span></div>`});let inf=document.getElementById("industry-filters");inf.innerHTML=`<div class="fi ${selectedIndustry==="all"?"active":""}" onclick="filterIndustry('all')">All<span class="c">${worlds.length}</span></div>`;Object.entries(industries).sort((a,b)=>b[1]-a[1]).forEach(([i,c])=>{inf.innerHTML+=`<div class="fi ${selectedIndustry===i?"active":""}" onclick="filterIndustry('${i}')">${i.replace(/-/g," ")}<span class="c">${c}</span></div>`})}function filterRegion(r){selectedRegion=r;renderFilters();renderWorlds()}function filterIndustry(i){selectedIndustry=i;renderFilters();renderWorlds()}function renderWorlds(){let filtered=worlds.filter(w=>{let region=w.p?w.p.split(",")[0].trim():"Unknown";let industry=w.i||"general";let matchesRegion=selectedRegion==="all"||region===selectedRegion;let matchesIndustry=selectedIndustry==="all"||industry===selectedIndustry;let matchesSearch=!searchTerm||JSON.stringify(w).toLowerCase().includes(searchTerm.toLowerCase());return matchesRegion&&matchesIndustry&&matchesSearch});let grid=document.getElementById("worlds-grid");document.getElementById("results").textContent=`${filtered.length} worlds`;if(!filtered.length){grid.innerHTML="<div class=\"empty\"><h3>No worlds found</h3><p>Try adjusting your filters</p></div>";return}grid.innerHTML=filtered.map(w=>{let robots=(w.rf||w.robots?.robot_types||w.trades?.robot_types||[]).map(r=>`<span class="tag rb">${r}</span>`).join("");let trades=(w.tr||w.trades?.union_certifications||[]).map(t=>`<span class="tag tr">${t}</span>`).join("");let anchors=(w.an||w.world?.zones||5);return`<div class="wc"><h3><a href="world.html?world=${w.slug}">${w.n||w.name||w.slug}</a></h3><div class="loc">${w.p||w.place||"Unknown location"}</div><div class="meta"><div class="mi"><div class="lb">Biome</div><div class="vl">${w.biome||"unknown"}</div></div><div class="mi"><div class="lb">Anchors</div><div class="vl">${anchors}</div></div></div><div class="tags">${robots}${trades}</div><div class="acts"><div class="ab pri" onclick="window.location.href='world.html?world=${w.slug}'">Enter World</div><div class="ab" onclick="window.location.href='datasets.html'">Datasets</div></div></div>`}).join("")}document.getElementById("search").addEventListener("input",e=>{searchTerm=e.target.value;renderWorlds()});loadWorlds()</script></body></html>
