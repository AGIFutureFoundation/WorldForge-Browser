<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorldForge Earth — 41 agentic worlds on real places</title>
<meta name="description" content="Walk 41 worlds built from real satellite imagery, elevation and map data. Each world has a basketball court, union trade simulators, robot digital twins, and a portal to RP1. Agents operate; people govern.">
<style>
:root{--ink:#e9f1ef;--mut:#9fb1ad;--acc:#43c59e;--bg:rgba(9,18,22,.85);--card:rgba(14,24,28,.9)}
*{box-sizing:border-box}body{margin:0;background:#0b1214;color:var(--ink);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:10;background:rgba(11,18,20,.95);backdrop-filter:blur(6px);border-bottom:1px solid rgba(255,255,255,.08);padding:14px 24px}
header h1{margin:0;font-size:1.2rem}header p{margin:4px 0 0;color:var(--mut);font-size:.85rem}
main{max-width:1200px;margin:0 auto;padding:24px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:12px;overflow:hidden;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,.4)}
.card img{width:100%;height:160px;object-fit:cover;background:#1a2a2f}
.card .bd{padding:12px 14px}
.card h2{margin:0 0 4px;font-size:.95rem}
.card .meta{margin:0 0 8px;font-size:.78rem;color:var(--mut);display:flex;gap:12px;flex-wrap:wrap}
.card .meta span{display:flex;align-items:center;gap:4px}
.btns{display:flex;gap:8px;margin-top:8px}
button{background:#17323a;color:var(--ink);border:1px solid #2b5a63;border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer;font-size:.8rem}
button:hover{background:#21454f}button:disabled{opacity:.5;cursor:not-allowed}
.badge{display:inline-block;font-size:.65rem;padding:2px 6px;border-radius:4px;background:rgba(67,197,158,.15);color:var(--acc)}
.badge.warn{background:rgba(230,126,34,.15);color:#e67e22}.badge.no{background:rgba(192,57,43,.15);color:#c0392b}
footer{padding:24px 16px;text-align:center;color:var(--mut);font-size:.75rem}
@media (max-width:600px){header{padding:12px 16px}}
</style>
</head><body>
<header><h1>WorldForge Earth</h1><p>41 agentic worlds on real places · <span id="count">0</span> ready · <a href="world.html?world=climate-dao">try one</a></p></header>
<main>
  <div class="grid" id="grid"></div>
</main>
<footer>Agents operate; people govern. All worlds are drafts. No live deployment on mainnet. <a href="../">WorldForge home</a></footer>
<script>
const $ = (s) => document.querySelector(s);
const grid = $('#grid');
let worlds = [], loaded = 0;

async function loadIndex() {
  const res = await fetch('worlds.json');
  if (!res.ok) { grid.innerHTML = '<p style="padding:24px;color:#c0392b">Could not load worlds.json</p>'; return; }
  worlds = await res.json();
  render();
}

function render() {
  grid.innerHTML = worlds.map(w => {
    const hasMap = !!w.geo;
    const hasWorld = !!w.world;
    const hasStills = !!w.still;
    return `
    <article class="card">
      ${hasStills ? `<img src="${w.still}" alt="${w.name}">` : '<div style="width:100%;height:160px;background:#1a2a2f"></div>'}
      <div class="bd">
        <h2>${w.name} <span class="badge">${w.slug}</span></h2>
        <p class="meta">
          <span>📍 ${w.place || 'no anchor'}</span>
          <span>🗺 ${w.geo ? 'real map' : 'pending'}</span>
        </p>
        <p class="meta">
          <span class="badge ${hasMap ? '' : 'warn'}">${hasMap ? 'map ready' : 'map pending'}</span>
          <span class="badge ${hasWorld ? '' : 'warn'}">${hasWorld ? 'world ready' : 'world pending'}</span>
        </p>
        <div class="btns">
          <button onclick="location.href='world.html?world=${w.slug}'" ${!hasWorld ? 'disabled' : ''}>Enter world</button>
          <button onclick="openRP1('${w.slug}')" ${!w.rp1 ? 'disabled' : ''}>Enter in RP1</button>
        </div>
      </div>
    </article>`;
  }).join('');
  $('#count').textContent = worlds.filter(w => w.world).length;
}

function openRP1(slug) {
  const w = worlds.find(x => x.slug === slug);
  if (!w?.rp1) return;
  window.open(w.rp1, '_blank', 'noopener');
}

loadIndex();
</script>
</body></html>
